<div class="container py-5">
  <div class="text-center mb-5">
    <button class="btn btn-outline-primary mx-2" (click)="switchLanguage('en')">English</button>
    <button class="btn btn-outline-secondary mx-2" (click)="switchLanguage('hu')">Magyar</button>
    <h2 class="mt-3">{{ 'TITLE' | translate }}</h2>
  </div>

  <div class="card shadow mb-5">
    <div class="card-body">
      <form (ngSubmit)="addProduct()" name="productForm">
        <div class="row gy-3">
          <div class="col-md-6">
            <input
              type="text"
              id="productName"
              class="form-control"
              [(ngModel)]="newProduct.name"
              name="productName"
              placeholder="{{ 'NAME' | translate }}"
              required
            />
          </div>
          <div class="col-md-6">
            <input
              type="text"
              id="productCategory"
              class="form-control"
              [(ngModel)]="newProduct.category"
              name="productCategory"
              placeholder="{{ 'CATEGORY' | translate }}"
              required
            />
          </div>
          <div class="col-md-6">
            <input
              type="text"
              id="productDescription"
              class="form-control"
              [(ngModel)]="newProduct.description"
              name="productDescription"
              placeholder="{{ 'DESCRIPTION' | translate }}"
            />
          </div>
          <div class="col-md-6">
            <input
              type="number"
              id="productPrice"
              class="form-control"
              [(ngModel)]="newProduct.price"
              name="productPrice"
              placeholder="{{ 'PRICE' | translate }}"
              step="0.01"
              required
            />
          </div>
          <div class="col-12 text-center">
            <button type="submit" class="btn btn-success">{{ 'ADD' | translate }}</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>{{ 'NAME' | translate }}</th>
          <th>{{ 'CATEGORY' | translate }}</th>
          <th>{{ 'DESCRIPTION' | translate }}</th>
          <th>{{ 'PRICE' | translate }}</th>
          <th>{{ 'ACTIONS' | translate }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products">
          <td>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="product.name"
              name="productName"
            />
          </td>
          <td>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="product.category"
              name="productCategory"
            />
          </td>
          <td>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="product.description"
              name="productDescription"
            />
          </td>
          <td>
            <input
              type="number"
              class="form-control"
              [(ngModel)]="product.price"
              name="productPrice"
              step="0.01"
            />
          </td>
          <td>
            <div class="d-flex justify-content-center">
              <button class="btn btn-outline-primary me-2" (click)="updateProduct(product)">{{ 'UPDATE' | translate }}</button>
              <button class="btn btn-outline-danger" (click)="deleteProduct(product.id)">{{ 'DELETE' | translate }}</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
